<app-head-bar></app-head-bar>
<app-search-bar [autos]="autoList" (selectAutoEvent)="updateAuto($event)"></app-search-bar>

<div class="details" *ngIf="selectedAuto">
  <div class="specs">
    <h4>Make</h4>
    <p>{{ selectedAuto.brand }}</p>
    <h4>Model</h4>
    <p>{{ selectedAuto.model }}</p>
    <h4>Price</h4>
    <p>{{ selectedAuto.price }} DNT</p>
    <h4>Power</h4>
    <p>{{ selectedAuto.power }} CV</p>
    <p class="units">{{ selectedAuto.units }} Units available</p>
  </div>
  <img [src]="selectedAuto.photo" [alt]="selectedAuto.model">
</div>
